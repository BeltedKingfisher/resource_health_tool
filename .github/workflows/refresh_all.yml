name: Refresh Health Check Data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
        
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
            pip install -e . --break-system-packages
            pip install python-dotenv --break-system-packages
            pip install aiohttp
            npm install contentful-cli
        
      - name: Run refresh pipeline
        env:
            CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
            CONTENTFUL_MANAGEMENT_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_ACCESS_TOKEN }}
        run: python3 scripts/refresh_all.py --exclude-status "Permanently Closed" "Temporarily Closed"

      - name: Push outputs to private data repo
        env:
            DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
            git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/BeltedKingfisher/resource-health-data.git /tmp/data-repo
            cp data/export.json data/broken_link_lookup.json data/outputs/health_report.csv /tmp/data-repo/
            cd /tmp/data-repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Automated data refresh $(date -u +%Y-%m-%d)" || echo "No changes to commit"
            git push
    